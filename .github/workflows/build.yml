name: Build overlay

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Check out source and libultrahand
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: make -j$(nproc)

      - name: Upload touch_cursor.ovl
        uses: actions/upload-artifact@v4
        with:
          name: touch-cursor-overlay
          path: touch_cursor.ovl
          if-no-files-found: error
